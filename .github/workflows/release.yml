name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pyproject.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag_version' but pyproject.toml has '$file_version'. Bump pyproject.toml before tagging." >&2
            exit 1
          fi
          echo "Version check OK: $file_version == $tag_version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Cache Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/_browsers
        run: bash scripts/build_release.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/_browsers
        run: pwsh -ExecutionPolicy Bypass -File scripts/build_release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fis-monitor-${{ runner.os }}
          path: dist/*
          retention-days: 7

  build-gen-license-linux:
    name: Build gen-license (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pyproject.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag_version' but pyproject.toml has '$file_version'. Bump pyproject.toml before tagging." >&2
            exit 1
          fi
          echo "Version check OK: $file_version == $tag_version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build gen-license (Linux)
        run: bash scripts/build_gen_license.sh --clean

      - name: Upload gen-license artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: gektar-gen-license-Linux
          path: dist/gektar-gen-license-linux-*
          retention-days: 7

  build-gen-license-windows:
    name: Build gen-license (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pyproject.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag_version' but pyproject.toml has '$file_version'. Bump pyproject.toml before tagging." >&2
            exit 1
          fi
          echo "Version check OK: $file_version == $tag_version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build gen-license (Windows)
        run: pwsh -ExecutionPolicy Bypass -File scripts/build_gen_license.ps1 -Clean

      - name: Upload gen-license artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: gektar-gen-license-Windows
          path: dist/gektar-gen-license-windows-*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, build-gen-license-linux, build-gen-license-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
