name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Cache Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/_browsers
        run: bash scripts/build_release.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/_browsers
        run: pwsh -ExecutionPolicy Bypass -File scripts/build_release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fis-monitor-${{ runner.os }}
          path: dist/*
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
