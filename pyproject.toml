[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fis-monitor"
version = "0.1.6"
description = "Мониторинг свободных гектаров на сайте Дальневосточного гектара"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "alex", email = "alexanc40@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.0",
    "sse-starlette>=2.1",
    "selectolax==0.4.8",
    "requests>=2.32",
    # urllib3 2.x меняет ClientHello (новые TLS-extensions / ALPN-список),
    # который сервер гектара (legacy web-сервер) реджектит с
    # TLSV1_ALERT_DECODE_ERROR. urllib3 1.26.x совместима. См. bd 7hp/e1w.
    "urllib3<2",
    "playwright==1.58.0",
    "psutil>=6.0",
    "watchdog>=4.0",
    "jinja2>=3.1",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    # На Windows у Python нет системной IANA-базы таймзон, и stdlib `zoneinfo`
    # ищет её в пакете `tzdata`. Без него падают и Europe/Moscow, и UTC
    # (ZoneInfoNotFoundError) — full-scan-тред умирает на старте.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
    "aiosmtpd>=1.4",
    "cryptography>=42.0",
    "mypy>=1.13",
]

[project.scripts]
fis-monitor = "fis_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fis_monitor = [
    "db/schema.sql",
    "web/templates/**/*.jinja",
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow integration tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/RUF002/RUF003 flag Cyrillic vs Latin look-alike characters.  This
# project's UI / domain copy is Russian — strings, docstrings and comments
# legitimately contain Cyrillic letters that overlap with the Latin alphabet
# (е, с, В, Х, К, ...).  Globally ignore the family rather than littering the
# codebase with per-line noqa directives.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/Path/Body/Header/Cookie/File/Form are idiomatic in
# argument defaults — B008 false-positives for the framework's design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]
