[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fis-monitor"
version = "0.1.0"
description = "Мониторинг свободных гектаров на сайте Дальневосточного гектара"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "alex", email = "alexanc40@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.0",
    "sse-starlette>=2.1",
    "selectolax==0.4.8",
    "requests>=2.32",
    "playwright==1.58.0",
    "psutil>=6.0",
    "watchdog>=4.0",
    "jinja2>=3.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[project.scripts]
fis-monitor = "fis_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fis_monitor = [
    "db/schema.sql",
    "web/templates/**/*.jinja",
    "web/templates/**/*.html",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
